// route terrestre : passage aux villes calé sur « l'Irak, la Syrie, la Palestine, l'Égypte »
const LAND_T = [[S("w09") + 0.2, 0], [HITS9[0], fracAt(R_LAND, 2)], [HITS9[1], fracAt(R_LAND, 4)], [HITS9[2], fracAt(R_LAND, 6)], [HITS9[3], 1]];

  [M("w11", 0.2), view(...along(R_SEA1, 0.82), 5.3), LIN],
  [M("w11", 0.65), view(14.3, 40.9, 5.7), LIN],
  [Ed("w11"), view(14.2, 41.0, 5.9), LIN],
  [S("w12") + 0.6, view(...CASSINO, 8.2), EX],                // Mont-Cassin
  [Ed("w13"), view(13.82, 41.5, 8.6), LIN],
  [Ed("w14"), view(13.9, 41.6, 8.2), LIN],
  [S("w15") + 0.4, view(8, 41, 4.4), EX],                     // vers l'Écosse
  [M("w15", 0.55), view(-8.5, 46, 4.45), LIN],
  [Ed("w15") + 0.1, view(-4.4, 55.6, 5.4), E],
  [S("w16") + 0.5, view(...EDIN, 7.4), EX],                   // zoo d'Édimbourg

  [S("w18") + 0.6, view(8, 53, 4.75), EX],                    // statues : Écosse et Pologne

  [DUR, view(9, 53, 5.2), LIN],

// caméra « vivante » : pendant les plans calmes, enchaînement de petits zooms / balayages (~1,7 s chacun)
const BEAT_PAT = [[150, -70, 0.2], [-160, 45, 0.06], [70, 110, -0.15], [-120, -90, 0.22], [165, 60, -0.08], [-80, -115, 0.15]];   // dosé : amplitude ÷2, ~3,4 s par mouvement

  if (e === EX || e === EO || d < 3.0) continue; const n = Math.max(2, Math.round(d/3.4)), pts = [[ta + 0.05, [0, 0, 0]]];

  pts.push([tb - 0.05, [0, 0, 0]]); BEATS.push(pts); }

const P = (lon, lat) => { const s = 2**CAM.z; return [(mx(wrapLon(lon)) - CAM.cx)*s + W/2, (my(lat) - CAM.cy)*s + H/2]; };
// ------------------------------------------------------------------ tuiles

};

}
// ------------------------------------------------------------------ outils de dessin
__HELPERS__

function lineLL(pts, alpha, color, w, dash=null){ if (alpha <= 0 || pts.length < 2) return null; const pp = pts.map(p => P(...p));

// arc (courbe) entre deux points, tracé jusqu'à k
const arcPts = (a, b, k, bend=0.25) => { const mxl = (a[0] + b[0])/2, myl = (a[1] + b[1])/2, dx = b[0] - a[0], dy = b[1] - a[1];

function photo(img, t, t0, t1, cy=1010, w=640, h=800){

// ------------------------------------------------------------------ données
let BB = [], BLASTS = [];
function setup(){

}
// bateau (PNG) en tête d'itinéraire, retourné selon le sens de la marche

  const tg = ctx.createLinearGradient(0, 0, 0, 560); tg.addColorStop(0, "rgba(0,0,0,.38)"); tg.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 560);

// flou de mouvement pendant les balayages / zooms rapides
function motionBlur(t){
  const a = camera(t), b = camera(t + 1/30), s = 2**a.z;
  let dx = (b.cx - a.cx)*s, dy = (b.cy - a.cy)*s; const dz = b.z - a.z, sp = Math.hypot(dx, dy);

  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); bctx.clearRect(0, 0, W, H); bctx.drawImage(cv, 0, 0);
  const N = 5, st = clamp(Math.max(sp/60, Math.abs(dz)/0.08));
  for (let i = 1; i <= N; i++){ const q = i/N, sc = 2**(-clamp(dz, -0.12, 0.12)*q*1.2);
    ctx.globalAlpha = 0.2*st; ctx.save(); ctx.translate(W/2 - dx*q*0.9, H/2 - dy*q*0.9); ctx.scale(sc, sc); ctx.drawImage(BUF, -W/2, -H/2); ctx.restore(); }
  ctx.restore();
}
// ------------------------------------------------------------------ sous-titres + frise
const CAPS = TL.vo.filter(v => !["w01", "w02", "w03", "w19"].includes(v.id)).map(v => {
  const words = [];
  for (const w of v.cap.split(/\s+/)){ const o = {hi:/\*/.test(w), w:w.replace(/\*/g, "")}; const p = words[words.length-1];
    if (p && (/^[:;!?…%]$/.test(o.w) || (/^\d+$/.test(p.w) && /^\d{3}/.test(o.w)))) { p.w += " " + o.w; p.hi = p.hi || o.hi; } else words.push(o); }
  const groups = []; let cur = [];
  for (const w of words){ const len = cur.map(x => x.w).join(" ").length + w.w.length + 1;
    if (cur.length && len > 14){ groups.push(cur); cur = []; } cur.push(w); if (/[.,:!?…]$/.test(w.w)){ groups.push(cur); cur = []; } }
  if (cur.length) groups.push(cur);
  const tot = d3.sum(groups, g => g.map(x => x.w).join(" ").length + 4); let acc = 0;
  return groups.map(g => { const l = g.map(x => x.w).join(" ").length + 4; const s = v.start + (v.end - v.start)*acc/tot; acc += l; return {g, s, e:v.start + (v.end - v.start)*acc/tot}; });
}).flat();
function yearAt(t){ let v = null; for (const [t0, t1, y0, y1] of TL.ticker) if (t >= t0) v = lerp(y0, y1, E(prog(t, t0, t1))); return v; }
const TWIN = [[S("w04"), Ed("w04") + 0.2], [S("w09"), Ed("w12") + 0.2], [S("w15"), Ed("w16")]];
const HITS = TL.sfx.filter(s => ["impact", "hit"].includes(s.name)).map(s => [s.t, s.name === "hit" ? 0.035 : 0.06, s.name === "hit" ? 5 : 10]);
HITS.push([0.03, 0.08, 12], [2.1, 0.05, 6]);
let PH = {};
function render(t){
  let p = 0, sx = 0, sy = 0;
  for (const [ti, amp, sh] of HITS) if (t >= ti){ const d = t - ti; p += amp*Math.exp(-d*8); sx += sh*Math.exp(-d*7)*Math.sin(d*50); sy += sh*0.7*Math.exp(-d*7)*Math.cos(d*43); }
  ctx.save(); ctx.translate(W/2 + sx, H/2 + sy); ctx.scale(1.04 + p, 1.04 + p); ctx.translate(-W/2, -H/2);
  renderMap(t); motionBlur(t);
  overlay(t);
  ctx.restore();
  const fl = Math.exp(-t*7); if (fl > 0.02){ ctx.fillStyle = `rgba(255,255,255,${0.6*fl})`; ctx.fillRect(0, 0, W, H); }
}
function counter(n, t, t0, t1, y, o={}){ const a = EB(prog(t, t0, t0 + 0.2))*(1 - prog(t, t1, t1 + 0.25)); if (a <= 0) return;
  txt(n, W/2, y, {size:fit(n, o.size || 190, W - 2*MARGIN), color:o.color || Y1, scale:a, alpha:Math.min(a, 1), stroke:22, glow:o.glow || "rgba(255,214,10,.45)"}); }
function overlay(t){
  bearIntro(t);
  photo(PH.combat, t, T_COMBAT, M("w08", 0.62), 1010, 700, 525);
  photo(PH.maitre, t, POPS16[1] - 0.05, Ed("w16") + 0.3, 1010, 700, 395);
  // ---- accroche

  kin("UN OURS", W/2, 480, t, M("w01", 0.38), {size:130, out:T_POL - 0.15}); kin("A COMBATTU", W/2, 610, t, M("w01", 0.48), {size:110, color:Y1, out:T_POL - 0.15});
  kin("DANS L'ARMÉE", W/2, 480, t, T_POL, {size:110, out:Ed("w01") + 0.25}); kin("POLONAISE", W/2, 610, t, T_POL + 0.1, {size:130, color:Y1, out:Ed("w01") + 0.25});
  ["UN GRADE", "DES RATIONS", "DE LA BIÈRE"].forEach((w, i) => kin(w, W/2, 560, t, POPS2[i] - 0.05, {size:130, color:i === 2 ? Y1 : "#fff", out:i < 2 ? POPS2[i + 1] - 0.15 : Ed("w02") + 0.15}));
  const hd = EB(prog(t, T_TITLE, T_TITLE + 0.3))*(1 - prog(t, S("w04") - 0.1, S("w04") + 0.25));
  if (hd > 0){ txt("WOJTEK", W/2, 480, {size:170, color:Y1, alpha:Math.min(hd, 1), stroke:20, scale:hd, glow:"rgba(255,214,10,.45)"}); txt("L'OURS SOLDAT", W/2, 630, {size:fit("L'OURS SOLDAT", 110, W - 2*MARGIN), alpha:Math.min(hd, 1), stroke:16, scale:hd}); }
  if (t > S("w19")){ const o1 = M("w19", 0.55);
    kin("ET TOI ?", W/2, 470, t, S("w19") + 0.1, {size:130, color:Y1, out:o1}); kin("D'AUTRES ANIMAUX", W/2, 610, t, S("w19") + 0.7, {size:100, out:o1}); kin("SOLDATS ?", W/2, 730, t, S("w19") + 1.0, {size:130, color:Y1, out:o1});
    const a = EB(prog(t, o1 + 0.2, o1 + 0.6)); txt("DIS-LE", W/2, 560, {size:120, color:Y1, scale:a, alpha:Math.min(a, 1), stroke:16});
    const b = EB(prog(t, o1 + 0.4, o1 + 0.8)); txt("EN COMMENTAIRE !", W/2, 680, {size:fit("EN COMMENTAIRE !", 84, W - 2*MARGIN), scale:b, alpha:Math.min(b, 1), stroke:13}); }

    for (let j = -1; j <= 1; j++){ const v = base + j, x = W/2 + (v - yv)*280; if (x < MARGIN || x > W - MARGIN) continue; const act = clamp(1 - Math.abs(v - yv));

  let cur = null; for (const g of CAPS) if (g.s <= t) cur = g;
  if (cur && t <= cur.e + 0.25){ const a = EB(prog(t, cur.s, cur.s + 0.15));
    const segs = cur.g.map((w, i) => ({t:(i ? " " : "") + w.w.replace(/[.,]+$/, "").toUpperCase(), c:w.hi ? Y1 : "#fff"}));
    richLine(segs, W/2, 300, {size:80, scale:0.8 + 0.2*a, alpha:Math.min(a*2, 1), stroke:16}); }

// ours (PNG) + grognement : il charge vers la caméra, puis sort

function outlined(img, r=9){ const c = document.createElement("canvas"); c.width = img.width + 2*r; c.height = img.height + 2*r; const g = c.getContext("2d");

const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { FLAG[k] = i; r(); }; i.onerror = r; i.src = src; });
