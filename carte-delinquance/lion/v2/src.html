    TR.forEach((p, i) => { const t0 = M("l11", 0.3) + i*0.2, [x, y] = P(...p); pin(x, y, EB(prog(t, t0, t0 + 0.3))*suA, "#fff", 10);
      arrow([p, [lerp(p[0], FES[0], 0.5), lerp(p[1], FES[1], 0.5) + 0.3], FES], E(prog(t, t0 + 0.1, t0 + 0.7)), suA, Y1, 7); });
    const [fx, fy] = P(...FES); pulse(fx, fy, t, suA, Y1, 100); pin(fx, fy, suA, Y1, 18); txt("FÈS", fx + 32, fy, {size:52, align:"left", alpha:suA, stroke:11}); }
  // l13 : zoo de Rabat
  const raA = prog(t, S("l13"), S("l13") + 0.3)*(1 - prog(t, Ed("l13"), Ed("l13") + 0.3));
  if (raA > 0){ const [x, y] = P(...RABAT); pulse(x, y, t, raA, Y1, 140); pin(x, y, raA, Y1, 20); }
  // l14 : les zoos du monde (moins de 100)
  const zoA = prog(t, S("l14") + 0.2, S("l14") + 0.5)*(1 - prog(t, Ed("l15"), Ed("l15") + 0.3));
  if (zoA > 0) ZOOS.forEach((p, i) => { const t0 = M("l14", 0.25) + i*0.09, [x, y] = P(...p); pin(x, y, EB(prog(t, t0, t0 + 0.3))*zoA, i ? Y1 : RED, 13); });
  // l16-l17 : Tchéquie, 4 lionceaux, puis direction le Maroc
  const czA = prog(t, S("l16"), S("l16") + 0.3)*(1 - prog(t, Ed("l17") + 0.1, Ed("l17") + 0.4));
  if (czA > 0){ flagFill("CZE", "cz", EO(prog(t, S("l16") + 0.2, S("l16") + 0.7))); flagFill("MAR", "ma", EO(prog(t, M("l17", 0.6), M("l17", 0.9))));
    arrow([CZOO, [5, 45], [-3, 37], [-6.5, 32]], E(prog(t, S("l17") + 0.1, M("l17", 0.85))), czA, Y1, 11); }
  // l18-l20 : le Maroc, symbole
  const syA = prog(t, S("l18"), S("l18") + 0.3);
  if (syA > 0) flagFill("MAR", "ma", EO(prog(t, S("l18") + 0.1, S("l18") + 0.6))*(1 - prog(t, S("l19") - 0.2, S("l19") + 0.4)));
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.45, W/2, H/2, H*0.85); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.32)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const tg = ctx.createLinearGradient(0, 0, 0, 560); tg.addColorStop(0, "rgba(0,0,0,.35)"); tg.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 560);

// ------------------------------------------------------------------ plan 3D
function clipAlpha(t){ return Math.min(EO(prog(t, CL.a, CL.a + 0.35)), 1 - prog(t, CL.b - 0.35, CL.b)); }
function drawClip(t){
  if (t < CL.a || t >= CL.b) return; const f = Math.min(Math.floor((t - CL.a)*30), 137), img = CLIPF["c" + f]; if (!img) return;
  const a = clipAlpha(t), z = 1 + 0.15*(1 - EO(prog(t, CL.a, CL.a + 0.35)));
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W/2, H/2); ctx.scale(z, z); ctx.drawImage(img, -W/2, -H/2, W, H); ctx.restore();
  const fl = Math.exp(-(t - CL.a)*9); if (fl > 0.02){ ctx.save(); ctx.fillStyle = `rgba(255,255,255,${0.45*fl})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}
// ------------------------------------------------------------------ sous-titres (gros, en haut) + frise des années
const CAPS = TL.vo.filter(v => !["l01", "l02", "l20"].includes(v.id)).map(v => {
  const words = [];
  for (const w of v.cap.split(/\s+/)){ const o = {hi:/\*/.test(w), w:w.replace(/\*/g, "")}; const p = words[words.length-1];
    if (p && (/^[:;!?…]$/.test(o.w) || (/^\d+$/.test(p.w) && /^\d{3}/.test(o.w)))) { p.w += " " + o.w; p.hi = p.hi || o.hi; } else words.push(o); }
  const groups = []; let cur = [];
  for (const w of words){ const len = cur.map(x => x.w).join(" ").length + w.w.length + 1;
    if (cur.length && len > 15){ groups.push(cur); cur = []; } cur.push(w); if (/[.,:!?…]$/.test(w.w)){ groups.push(cur); cur = []; } }
  if (cur.length) groups.push(cur);
  const tot = d3.sum(groups, g => g.map(x => x.w).join(" ").length + 4); let acc = 0;
  return groups.map(g => { const l = g.map(x => x.w).join(" ").length + 4; const s = v.start + (v.end - v.start)*acc/tot; acc += l; return {g, s, e:v.start + (v.end - v.start)*acc/tot}; });
}).flat();
function yearAt(t){ let v = null; for (const [t0, t1, y0, y1] of TL.ticker) if (t >= t0) v = lerp(y0, y1, E(prog(t, t0, t1))); return v; }
const HITS = () => [[0.03, 0.08, 14], [0.75, 0.05, 8], [M("l01", 0.8), 0.07, 10], [M("l02", 0.6), 0.06, 6], [M("l04", 0.8), 0.06, 8], [M("l05", 0.5), 0.04, 6],
  [CL.a, 0.05, 0], [M("l07", 0.62), 0.06, 0], [M("l08", 0.62), 0.09, 16], [M("l09", 0.45), 0.07, 10], [S("l10") + 0.5, 0.06, 0], [M("l13", 0.3), 0.05, 0],
  [M("l16", 0.55), 0.05, 6], [M("l17", 0.8), 0.05, 6], [M("l18", 0.62), 0.07, 10]];
function render(t){
  let p = 0, sx = 0, sy = 0;
  for (const [ti, amp, sh] of HITS()) if (t >= ti){ const d = t - ti; p += amp*Math.exp(-d*8); sx += sh*Math.exp(-d*7)*Math.sin(d*50); sy += sh*0.7*Math.exp(-d*7)*Math.cos(d*43); }
  ctx.save(); ctx.translate(W/2 + sx, H/2 + sy); ctx.scale(1.04 + p, 1.04 + p); ctx.translate(-W/2, -H/2);
  const ca = clipAlpha(t) * (t >= CL.a && t < CL.b ? 1 : 0);
  if (ca < 0.999) renderMap(t); else { ctx.fillStyle = "#000"; ctx.fillRect(-60, -60, W + 120, H + 120); }
  drawClip(t);
  overlay(t, 1 - ca);
  ctx.restore();
  // flash de l'appareil photo (1925)
  const ph = Math.exp(-Math.max(0, t - M("l07", 0.62))*10)*(t >= M("l07", 0.62) ? 1 : 0); if (ph > 0.02){ ctx.fillStyle = `rgba(255,255,255,${0.8*ph})`; ctx.fillRect(0, 0, W, H); }
  const rf = Math.exp(-Math.max(0, t - M("l08", 0.62))*8)*(t >= M("l08", 0.62) ? 1 : 0); if (rf > 0.02){ ctx.fillStyle = `rgba(255,40,30,${0.35*rf})`; ctx.fillRect(0, 0, W, H); }
}
function overlay(t, mapA){
  // ---- accroche : lion (PNG fourni) + rugissement, seulement au début
  lionIntro(t);
  kin("LE PLUS GRAND LION", W/2, 470, t, M("l01", 0.05), {size:92, out:M("l01", 0.7)});
  kin("DU MONDE ?", W/2, 590, t, M("l01", 0.3), {size:110, color:Y1, out:M("l01", 0.7)});
  kin("… AU MAROC !", W/2, 560, t, M("l01", 0.76), {size:110, color:Y1, out:Ed("l01") + 0.2});
  const hd = EO(prog(t, S("l02") - 0.1, S("l02") + 0.4))*(1 - prog(t, S("l03") - 0.1, S("l03") + 0.2));
  if (hd > 0){ txt("LE LION", W/2, 300, {size:130, alpha:hd, stroke:16, scale:0.85 + 0.15*hd}); txt("DE L'ATLAS", W/2, 430, {size:118, color:Y1, alpha:hd, stroke:16, scale:0.85 + 0.15*hd, glow:"rgba(255,214,10,.45)"}); }
  // ---- faits marquants (textes droits, sans cadre)
  kin("IL Y A 2 000 ANS", W/2, 560, t, S("l03") + 0.1, {size:96, color:Y1, out:M("l03", 0.38)});
  const kg = Math.round(300*EO(prog(t, M("l04", 0.62), M("l04", 0.9)))), kgA = EB(prog(t, M("l04", 0.6), M("l04", 0.75)))*(1 - prog(t, Ed("l04") + 0.1, Ed("l04") + 0.35))*mapA;
  if (kgA > 0) txt(`${kg} KG`, W/2, 620, {size:170, color:Y1, scale:kgA, alpha:Math.min(kgA, 1), stroke:20, glow:"rgba(255,214,10,.45)"});
  kin("CRINIÈRE SOMBRE", W/2, 600, t, M("l04", 0.05), {size:92, out:M("l04", 0.55)});
  kin("DES MILLIERS", W/2, 1250, t, M("l05", 0.3), {size:96, color:Y1, out:Ed("l05") + 0.1});
  kin("1942", W/2, 600, t, S("l08") + 0.3, {size:170, color:RED, out:Ed("l08")});
  kin("DISPARU", W/2, 620, t, M("l09", 0.4), {size:140, color:RED, out:Ed("l09") + 0.2});
  kin("MAIS…", W/2, 620, t, S("l10") + 0.3, {size:140, color:Y1, out:Ed("l10")});
  kin("MÉNAGERIE ROYALE", W/2, 600, t, S("l12") + 0.1, {size:92, color:Y1, out:Ed("l12") + 0.1});
  kin("ZOO DE RABAT", W/2, 560, t, M("l13", 0.25), {size:104, color:Y1, out:M("l13", 0.75)});
  kin("N°1 MONDIAL", W/2, 680, t, M("l13", 0.55), {size:88, out:Ed("l13") + 0.1});
  const cA = EB(prog(t, M("l14", 0.3), M("l14", 0.45)))*(1 - prog(t, Ed("l14") + 0.2, Ed("l14") + 0.5));
  if (cA > 0) txt("< 100", W/2, 640, {size:180, color:Y1, scale:cA, alpha:Math.min(cA, 1), stroke:20, glow:"rgba(255,214,10,.45)"});
  kin("PURETÉ GÉNÉTIQUE ?", W/2, 620, t, M("l15", 0.25), {size:88, out:Ed("l15") + 0.1});
  kin("4 LIONCEAUX", W/2, 600, t, M("l16", 0.5), {size:110, color:Y1, out:Ed("l16") + 0.2});
  kin("RETOUR AU MAROC ?", W/2, 620, t, M("l17", 0.4), {size:92, color:Y1, out:Ed("l17") + 0.2});
  kin("LES LIONS", W/2, 560, t, M("l18", 0.6), {size:120, color:Y1, out:Ed("l18") + 0.2});
  kin("DE L'ATLAS", W/2, 690, t, M("l18", 0.7), {size:120, out:Ed("l18") + 0.2});
  kin("REVOIR RUGIR ?", W/2, 600, t, M("l19", 0.5), {size:110, color:Y1, out:S("l20") + 0.2});
  if (t > S("l20")){ const a = EB(prog(t, S("l20") + 0.1, S("l20") + 0.5)); txt("DIS-LE", W/2, 560, {size:120, color:Y1, scale:a, alpha:Math.min(a, 1), stroke:16});
    const b = EB(prog(t, S("l20") + 0.35, S("l20") + 0.75)); txt("EN COMMENTAIRE !", W/2, 680, {size:84, scale:b, alpha:Math.min(b, 1), stroke:13}); }
  // ---- frise des années
  const yv = yearAt(t), ya = mapA*(yv === null ? 0 : 1)*EO(prog(t, S("l06") - 0.2, S("l06") + 0.2))*(1 - prog(t, Ed("l09"), Ed("l09") + 0.3) + prog(t, S("l12"), S("l12") + 0.3)*(1 - prog(t, Ed("l13"), Ed("l13") + 0.3)) + prog(t, S("l16"), S("l16") + 0.3)*(1 - prog(t, Ed("l16"), Ed("l16") + 0.3)));
  if (ya > 0 && !(t >= CL.a && t < CL.b)){ const base = Math.round(yv);
    for (let j = -2; j <= 2; j++){ const v = base + j, x = W/2 + (v - yv)*300; if (x < -200 || x > W + 200) continue; const act = clamp(1 - Math.abs(v - yv));
      txt(String(v), x, 450, {size:44 + act*40, color:act > 0.5 ? Y1 : "#fff", alpha:Math.min(ya, 1)*(0.35 + 0.65*act), stroke:9, glow:act > 0.5 ? "rgba(255,214,10,.45)" : null}); } }
  // ---- sous-titres
  let cur = null; for (const g of CAPS) if (g.s <= t) cur = g;
  if (cur && t <= cur.e + 0.25){ const a = EB(prog(t, cur.s, cur.s + 0.15));
    const segs = cur.g.map((w, i) => ({t:(i ? " " : "") + w.w.replace(/[.,]+$/, "").toUpperCase(), c:w.hi ? Y1 : "#fff"}));
    richLine(segs, W/2, 300, {size:80, scale:0.8 + 0.2*a, alpha:Math.min(a*2, 1), stroke:16}); }
}
let LION = null;
function lionIntro(t){
  if (!LION) return; const out = E(prog(t, S("l01") + 1.2, S("l01") + 1.6)); if (out >= 1) return;
  const a = EB(prog(t, 0, 0.3)), roar = [0.03, 0.75].reduce((m, q) => m + (t >= q ? Math.exp(-(t - q)*6) : 0), 0);

  ctx.save(); ctx.translate(W/2 + Math.sin(t*55)*10*roar, 1330 + out*900); ctx.scale(a, a);
  ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18; ctx.drawImage(LION, -w/2, -h, w, h); ctx.restore();
}
function outlined(img, r=9){ const c = document.createElement("canvas"); c.width = img.width + 2*r; c.height = img.height + 2*r; const g = c.getContext("2d");
  for (let a = 0; a < 32; a++) g.drawImage(img, r + Math.cos(a/32*6.283)*r, r + Math.sin(a/32*6.283)*r);
  g.globalCompositeOperation = "source-in"; g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.globalCompositeOperation = "source-over"; g.drawImage(img, r, r); return c; }
window.renderAt = render;
const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { FLAG[k] = i; r(); }; i.onerror = r; i.src = src; });
window.ready = Promise.all([fetch("geo.json").then(r => r.json()).then(j => { GEO = j; }),
  ...["ma", "dz", "tn", "ly", "eg", "it", "cz"].map(f => load(f, `flags/${f}.svg`)),
  new Promise(r => { const i = new Image(); i.onload = () => { LION = outlined(i); r(); }; i.onerror = r; i.src = "assets/lion.png"; }),
  document.fonts.load("900 60px M"), document.fonts.load("800 60px M")]).then(() => true);
