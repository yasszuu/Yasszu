<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Les lapins d'Australie</title>
<style>
@font-face{font-family:M;font-weight:900;src:url(../node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format("woff2");}
@font-face{font-family:M;font-weight:800;src:url(../node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2) format("woff2");}
html,body{margin:0;background:#0b1622}
#c{width:540px;height:960px;display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../node_modules/d3/dist/d3.min.js"></script>
<script>
const TL = __TL__, DUR = TL.duration;
const W = 1080, H = 1920, TS = 256, ZMIN = 3, ZMAX = 8;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const BUF = document.createElement("canvas"); BUF.width = W; BUF.height = H; const bctx = BUF.getContext("2d");
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a)*k;
const prog = (t, a, b) => clamp((t - a)/(b - a));
const E = d3.easeCubicInOut, EO = d3.easeCubicOut, EB = d3.easeBackOut.overshoot(1.8), EX = d3.easeExpInOut, LIN = d3.easeLinear;
const Y1 = "#ffd60a", RED = "#ff3b30", INV = [255, 92, 38], VIR = "#b6ff3a";
const V = Object.fromEntries(TL.vo.map(v => [v.id, v]));
const S = k => V[k].start, Ed = k => V[k].end, M = (k, f) => S(k) + (Ed(k) - S(k))*f;
const SFX = n => TL.sfx.filter(s => s.name === n).map(s => s.t);
const near = (n, a, b) => SFX(n).find(x => x >= a && x <= b);
// ------------------------------------------------------------------ lieux
const GEELONG = [144.36, -38.15], AUSC = [133.6, -27.2];
const ROUTE = [[-1.4,50.6],[-9.5,44],[-14,33],[-19,18],[-20,5],[-10,-14],[6,-30],[18.4,-36.5],[35,-40],[60,-42],[90,-42.5],[115,-40.5],[132,-38.5],[144.36,-38.15]];
const FENCES = [
  [[120.13,-33.92],[120.5,-31.5],[120.2,-29.4],[119.9,-26.6],[120.3,-24.0],[120.2,-22.0],[119.8,-19.96]],
  [[118.9,-34.4],[117.9,-32.6],[117.3,-30.3],[116.7,-28.4],[116.4,-26.6]],
  [[116.9,-27.6],[115.6,-27.6],[114.3,-27.7]],
];
// aire actuelle du lapin (~70 % du pays : tout sauf le nord tropical)
const RANGE = [[110,-21.5],[114,-22],[117.5,-20.6],[121,-19.6],[124,-20.6],[127,-20.2],[130,-19.4],[133.5,-18.8],[136.5,-18.2],[139.5,-19.4],[142.5,-20.6],[145.5,-21.8],[148.5,-22.4],[151,-23.6],[155,-25],[155,-46],[110,-46]];
const ROUTE_D = (() => { const d = [0]; for (let i = 1; i < ROUTE.length; i++) d.push(d[i-1] + Math.hypot(ROUTE[i][0] - ROUTE[i-1][0], ROUTE[i][1] - ROUTE[i-1][1])); return d; })();
function routeAt(k){ const L = ROUTE_D[ROUTE_D.length - 1]*clamp(k); let i = 1; while (i < ROUTE.length - 1 && ROUTE_D[i] < L) i++;
  const q = (L - ROUTE_D[i-1])/(ROUTE_D[i] - ROUTE_D[i-1]); return [lerp(ROUTE[i-1][0], ROUTE[i][0], q), lerp(ROUTE[i-1][1], ROUTE[i][1], q)]; }
const kmTo = ([lon, lat], d, th) => [lon + d*Math.cos(th)/(111.3*Math.cos(lat*Math.PI/180)), lat + d*Math.sin(th)/111.3];
const kmBetween = (a, b) => d3.geoDistance(a, b)*6371;
// ------------------------------------------------------------------ calendrier
const T_ROUTE = [M("r05", 0.5), S("r06") + 0.25];
const T_FLAG_AU = near("impact", M("r01", 0.85), Ed("r01"));
const T_200 = near("impact", S("r02"), Ed("r02")), T_TITLE = near("impact", S("r03"), Ed("r03"));
const T_20K = near("impact", S("r07"), Ed("r07")), T_100KM = near("impact", S("r09"), M("r09", 0.6)), T_FAST = near("hit", M("r09", 0.6), Ed("r09"));
const T_CONT = near("impact", S("r10"), Ed("r10")), T_FENCE = near("impact", S("r11"), Ed("r11")), T_3000 = near("impact", S("r12"), Ed("r12"));
const T_LATE = SFX("stamp")[0], T_MYXO = near("impact", S("r14"), Ed("r14")), T_DOWN = SFX("down")[0], T_100M = near("impact", S("r15"), Ed("r15"));
const T_70 = near("impact", S("r17"), Ed("r17")), T_24 = near("impact", S("r18"), Ed("r18"));
const POPS24 = SFX("pop").filter(x => x > M("r06", 0.5) && x < Ed("r06")), POPS1 = SFX("pop").filter(x => x > S("r01") && x < Ed("r01"));
const THUDS = SFX("step").filter(x => x > S("r12") && x < Ed("r12"));
// rayon d'invasion (km depuis Geelong)
function Rkm(t){
  return 70*E(prog(t, S("r07") + 0.2, T_20K)) + 230*E(prog(t, M("r08", 0.5), Ed("r08"))) + 1950*d3.easeQuadIn(prog(t, S("r09") + 0.3, T_CONT))
       + 1200*E(prog(t, T_LATE - 0.3, Ed("r13")));
}
// ------------------------------------------------------------------ caméra
const mx = lon => (lon + 180)/360*TS;
const my = lat => { const r = lat*Math.PI/180; return (1 - Math.log(Math.tan(r) + 1/Math.cos(r))/Math.PI)/2*TS; };
const view = (lon, lat, z, dy=-90) => [mx(lon), my(lat) - dy/2**z, W/2**z];
const AUS = (z=5.05, dl=0, db=0) => view(AUSC[0] + dl, AUSC[1] + db, z);
const GEE = (z, dy=-90) => view(GEELONG[0], GEELONG[1], z, dy);
const RK = [];
for (let i = 0; i <= 10; i++){ const k = i/10, tt = lerp(T_ROUTE[0] + 0.55, T_ROUTE[1] - 0.2, k); const rp = routeAt(Math.min(1, k + 0.06)); RK.push([tt, view(rp[0], rp[1], lerp(4.0, 4.7, k*k), lerp(-60, 170, clamp((40 - rp[1])/50))), i ? LIN : EX]); }
const KEYS = [
  [0.0,   view(118, -20, 4.15)],
  [0.55,  view(121, -22, 4.45), EO],
  [1.35,  AUS(5.0), EX],                                           // whip sur l'Australie
  [M("r01", 0.46), AUS(5.15, 1.2, -0.6), LIN],
  [M("r01", 0.57), GEE(7.3), EX],                                  // plongée sur Geelong : 24 lapins
  [M("r01", 0.72), GEE(7.5), LIN],
  [T_FLAG_AU - 0.1, AUS(5.0), EX],                                 // drapeau
  [S("r02") - 0.25, AUS(5.12, 0.5), LIN],
  [S("r02") + 0.65, AUS(4.8, 0.3, -0.6), EX],                      // 200 millions : l'explosion
  [Ed("r02") + 0.2, AUS(5.05, 0.6, -0.5), LIN],
  [S("r03") + 0.55, view(119.5, -28.5, 5.85), EX],                 // balayage ouest → est
  [M("r03", 0.52), view(148.5, -30.5, 5.85), E],
  [M("r03", 0.7), AUS(5.0), EX],                                   // titre
  [Ed("r03") + 0.4, AUS(5.2, 0.4), LIN],
  [S("r04") + 0.5, GEE(7.2, -330), EX],                            // Thomas Austin, Geelong
  [Ed("r04") - 0.3, view(144.1, -38.0, 7.55, -330), LIN],
  [S("r05") + 0.7, view(-1.6, 52.6, 5.55), EX],                    // l'Angleterre
  [T_ROUTE[0] + 0.1, view(-1.4, 52.4, 5.8), LIN],
  ...RK,                                                           // la traversée
  [S("r06") + 0.7, GEE(7.3), EX],
  [Ed("r06"), view(144.2, -38.05, 7.6), LIN],                    // Noël 1859
  [S("r07") + 0.5, GEE(7.75), EX],
  [Ed("r07") + 0.2, GEE(7.0), LIN],                               // 20 000
  [S("r08") + 0.7, view(145, -36.6, 5.95), EX],
  [Ed("r08"), view(144.4, -35.8, 5.75), LIN],                      // aucun prédateur
  [S("r09") + 0.5, view(140.5, -32.5, 5.3), EX],                   // le front avance
  [Ed("r09"), view(134.5, -28.8, 5.1), LIN],
  [Ed("r10"), view(130.5, -27.5, 4.98), LIN],
  [S("r11") + 0.6, view(119.5, -28.5, 5.95), EX],                  // Australie-Occidentale
  [S("r12") - 0.1, view(119.2, -28.0, 6.1), LIN],
  [THUDS[0] + 0.4, view(120.2, -33.0, 6.35), EX],                  // le long de la clôture n°1
  [THUDS[6] + 0.2, view(120.0, -21.5, 6.35), LIN],
  [THUDS[10] + 0.1, view(116.8, -29.5, 6.3), E],                   // clôtures 2 et 3
  [Ed("r12") + 0.2, view(118.5, -28.2, 5.95), E],
  [Ed("r13"), view(117.5, -29.0, 6.2), LIN],                       // trop tard
  [S("r14") + 0.55, AUS(5.05), EX],                                // myxomatose
  [Ed("r14"), AUS(5.22, 2.5, -2.5), LIN],
  [Ed("r15"), AUS(5.42, 4.5, -4.5), LIN],
  [S("r16") + 0.5, AUS(5.1, 0, 0), EX],
  [Ed("r16"), AUS(5.25, -2, 0.5), LIN],
  [S("r17") + 0.45, AUS(4.95), EX],                                // 70 %
  [Ed("r17"), AUS(5.12, 0.4), LIN],
  [S("r18") + 0.55, GEE(7.4), EX],                                 // 24 lapins
  [Ed("r18") + 0.3, GEE(7.65), LIN],
  [S("r19") + 1.0, AUS(5.0), EX],
  [DUR, AUS(5.35, 1, -1), LIN],
];
function camera(t){
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i+1][0]) i++;
  const [ta, va] = KEYS[i], [tb, vb, eb] = KEYS[i+1], k = (eb || E)(prog(t, ta, tb));
  const v = d3.interpolateZoom(va, vb)(k); return {cx:v[0], cy:v[1], z:Math.log2(W/v[2])};
}
let CAM = camera(0);
const P = (lon, lat) => { const s = 2**CAM.z; return [(mx(lon) - CAM.cx)*s + W/2, (my(lat) - CAM.cy)*s + H/2]; };
// ------------------------------------------------------------------ tuiles
const TILES = {};
function visibleTiles(cam, z){
  const s = 2**cam.z, n = 2**z, out = [], m = 1.12;
  const tx0 = Math.floor((cam.cx - W*m/2/s)*n/TS), tx1 = Math.floor((cam.cx + W*m/2/s)*n/TS);
  const ty0 = Math.floor((cam.cy - H*m/2/s)*n/TS), ty1 = Math.floor((cam.cy + H*m/2/s)*n/TS);
  for (let x = tx0; x <= tx1; x++) for (let y = ty0; y <= ty1; y++) if (y >= 0 && y < n) out.push([z, ((x % n) + n) % n, y]);
  return out;
}
const levelFor = z => Math.max(ZMIN, Math.min(ZMAX, Math.floor(z + 0.5)));
window.plan = () => { const set = new Set();
  for (let f = 0; f < DUR*30; f++){ const c = camera(f/30), L = levelFor(c.z);
    for (const zz of [L, Math.max(ZMIN, L - 1)]) for (const [z, x, y] of visibleTiles(c, zz)) set.add(`${z}/${x}/${y}`); }
  return [...set]; };
window.prep = async t => {
  const jobs = [], c = camera(t), L = levelFor(c.z);
  for (const [z, x, y] of [...visibleTiles(c, L), ...visibleTiles(c, Math.max(ZMIN, L - 1))]){ const k = `${z}/${x}/${y}`; if (k in TILES) continue;
    jobs.push(new Promise(r => { const i = new Image(); i.onload = () => { TILES[k] = i; r(); }; i.onerror = () => { TILES[k] = null; r(); }; i.src = `tiles/${k}.jpg`; })); }
  await Promise.all(jobs);
};
function drawTiles(){
  const L = levelFor(CAM.z), s = 2**CAM.z;
  for (const zz of [Math.max(ZMIN, L - 1), L]){ const ts = TS*2**(CAM.z - zz);
    for (const [z, x, y] of visibleTiles(CAM, zz)){ const img = TILES[`${z}/${x}/${y}`]; if (!img) continue;
      const sx = (x*TS/2**z - CAM.cx)*s + W/2, sy = (y*TS/2**z - CAM.cy)*s + H/2;
      ctx.drawImage(img, Math.floor(sx), Math.floor(sy), Math.ceil(ts) + 1, Math.ceil(ts) + 1); } }
}
// ------------------------------------------------------------------ outils de dessin
__HELPERS__
function inView(bb, pad=80){ const [a, b] = P(bb[0], bb[3]), [c, d] = P(bb[2], bb[1]); return c > -pad && a < W + pad && d > -pad && b < H + pad; }
function lineLL(pts, k, alpha, color, w, dash=null){ if (k <= 0 || alpha <= 0) return;
  const n = Math.max(2, Math.ceil(pts.length*k)); const pp = pts.slice(0, n).map(p => P(...p));
  ctx.save(); ctx.globalAlpha = Math.min(alpha, 1); ctx.lineCap = "round"; ctx.lineJoin = "round"; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); pp.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = w + 8; ctx.stroke(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke(); ctx.restore(); return pp[pp.length - 1]; }
const dense = (pts, n) => { const out = []; for (let i = 0; i < pts.length - 1; i++) for (let j = 0; j < n; j++){ const q = j/n; out.push([lerp(pts[i][0], pts[i+1][0], q), lerp(pts[i][1], pts[i+1][1], q)]); } out.push(pts[pts.length - 1]); return out; };
// ------------------------------------------------------------------ lapins (points)
let AUSRING = null, DOTS = [], NEAR = [], BB = [];
function setup(){
  AUSRING = GEO.c.AUS.reduce((a, b) => a.length > b.length ? a : b);
  BB = GEO.b.map(r => [d3.min(r, p => p[0]), d3.min(r, p => p[1]), d3.max(r, p => p[0]), d3.max(r, p => p[1])]);
  const rnd = d3.randomLcg(42);
  while (DOTS.length < 1500){ const p = [112 + rnd()*42, -44 + rnd()*34];
    if (!d3.polygonContains(AUSRING, p) || !d3.polygonContains(RANGE, p)) continue;
    DOTS.push({p, d:kmBetween(p, GEELONG)*(0.85 + 0.3*rnd()), k:rnd()}); }
  for (let i = 0; i < 420; i++){ const a = rnd()*6.283, d = 6 + 290*Math.pow(rnd(), 1.6), p = kmTo(GEELONG, d, a);
    if (!d3.polygonContains(AUSRING, p) || (p[1] < -37.9 && p[1] > -38.35 && p[0] > 144.3 && p[0] < 145.1)) continue;   // sur terre, pas dans la baie
    DOTS.push({p, d, k:rnd()}); }
  for (let i = 0; i < 24; i++){ const a = i*2.399, rr = 0.03 + 0.05*Math.sqrt(i); NEAR.push([143.95 + Math.cos(a)*rr*1.3, -38.08 + Math.sin(a)*rr]); }
  DOTS.sort((a, b) => a.d - b.d);
}
// survie pendant la myxomatose (5 sur 6 meurent), puis retour
function alive(dt, t){ if (dt.k < 0.17) return 1;
  const die = lerp(T_DOWN, T_100M, dt.k), back = lerp(M("r16", 0.6), Ed("r16") + 0.4, dt.k);
  return 1 - prog(t, die, die + 0.3) + EB(prog(t, back, back + 0.3)); }
function drawDots(t){
  const R = Rkm(t), s = clamp(2**(CAM.z - 5)*3.3, 3.5, 10), cull = 60;
  const full = prog(t, T_70 - 0.3, T_70 + 0.4);
  ctx.save(); const live = new Path2D(), dead = new Path2D();
  for (const dt of DOTS){ const tin = dt.d < R ? 1 : 0; if (!tin) continue;
    const age = (R - dt.d)/Math.max(30, R*0.08), a = EB(clamp(age)), [x, y] = P(...dt.p);
    if (x < -cull || x > W + cull || y < -cull || y > H + cull) continue;
    const al = alive(dt, t), r = s*a*(0.6 + 0.4*Math.min(al, 1.2));
    if (al < 0.5){ dead.moveTo(x + s*0.5, y); dead.arc(x, y, s*0.5, 0, 7); }
    else { live.moveTo(x + r, y); live.arc(x, y, r, 0, 7); } }
  ctx.fillStyle = "rgba(40,40,40,.55)"; ctx.fill(dead);
  ctx.lineWidth = 2.2; ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.fillStyle = `rgb(${INV})`; ctx.fill(live); ctx.stroke(live);
  ctx.restore();
}
// aplat d'invasion : disque « vivant » autour de Geelong, limité à l'aire du lapin
function drawFront(t){
  const R = Rkm(t); if (R < 120) return;
  const myx = 1 - 0.6*prog(t, T_DOWN, T_100M) + 0.6*prog(t, M("r16", 0.6), Ed("r16") + 0.4), full = prog(t, T_70 - 0.3, T_70 + 0.3);
  const ring = d3.range(0, 361, 3).map(d => { const th = d*Math.PI/180;
    return kmTo(GEELONG, R*(1 + 0.11*Math.sin(5*th + t*0.7) + 0.06*Math.sin(11*th - t*1.3)), th); });
  ctx.save(); path([AUSRING]); ctx.clip(); path([RANGE]); ctx.clip();
  path([ring]); ctx.fillStyle = `rgba(${INV},${(0.34 + 0.2*full)*myx})`; ctx.fill();
  ctx.lineJoin = "round"; ctx.lineWidth = 7; ctx.strokeStyle = `rgba(255,214,10,${0.9*(1 - prog(t, Ed("r13"), Ed("r13") + 0.5))})`; ctx.stroke();
  ctx.restore();
}
// ------------------------------------------------------------------ carte
function renderMap(t){
  CAM = camera(t);
  ctx.fillStyle = "#0b1622"; ctx.fillRect(-60, -60, W + 120, H + 120);
  drawTiles();
  ctx.save(); ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 1.5; ctx.lineJoin = "round";
  GEO.b.forEach((r, i) => { if (inView(BB[i])){ path([r]); ctx.stroke(); } }); ctx.restore();
  // ---- drapeaux
  flagFill("AUS", "au", EO(prog(t, T_FLAG_AU - 0.08, T_FLAG_AU + 0.45))*(1 - prog(t, S("r02") + 0.3, S("r02") + 0.8)));
  flagFill("ENG", "gb-eng", EO(prog(t, near("impact", S("r05"), M("r05", 0.4)) - 0.05, M("r05", 0.45)))*(1 - prog(t, T_ROUTE[0] + 0.4, T_ROUTE[0] + 1.0)));
  // ---- hook : 24 lapins à Geelong
  const h24 = prog(t, POPS1[0] - 0.05, POPS1[0])*(1 - prog(t, T_FLAG_AU - 0.3, T_FLAG_AU));
  NEAR.forEach((p, i) => { const [x, y] = P(...p), a = EB(prog(t, POPS1[i] || 0, (POPS1[i] || 0) + 0.2))*h24; if (a > 0) pin(x, y, a, `rgb(${INV})`, 11); });
  // ---- hook : 200 millions, tout le continent explose
  const boom = prog(t, S("r02") + 0.15, T_200)*(1 - prog(t, S("r04") - 0.4, S("r04") + 0.1));
  if (boom > 0){ ctx.save(); path([AUSRING]); ctx.clip(); path([RANGE]); ctx.clip();
    const s = clamp(2**(CAM.z - 5)*3.3, 3.5, 10), nb = Math.floor(DOTS.length*boom), live = new Path2D();
    for (let i = 0; i < nb; i++){ const [x, y] = P(...DOTS[i].p), a = EB(clamp((boom*DOTS.length - i)/120)); live.moveTo(x + s*a, y); live.arc(x, y, s*a, 0, 7); }
    ctx.fillStyle = `rgba(${INV},${0.35*boom})`; path([AUSRING]); ctx.fill();
    ctx.lineWidth = 2.2; ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.fillStyle = `rgb(${INV})`; ctx.fill(live); ctx.stroke(live); ctx.restore(); }
  // ---- Geelong (Thomas Austin)
  const geA = prog(t, S("r04") + 0.3, S("r04") + 0.6)*(1 - prog(t, Ed("r04"), Ed("r04") + 0.3));
  const th = near("hit", S("r04"), Ed("r04"));
  if (geA > 0){ const [x, y] = P(...GEELONG); pulse(x, y, t, geA*prog(t, th - 0.1, th), Y1, 130); pin(x, y, EB(prog(t, th - 0.05, th + 0.25))*geA, Y1, 20);
    txt("GEELONG", x, y - 74, {size:60, alpha:prog(t, th, th + 0.25)*geA, stroke:12, scale:0.8 + 0.2*EB(prog(t, th, th + 0.3))}); }
  // ---- la traversée Angleterre → Australie
  const roA = prog(t, T_ROUTE[0], T_ROUTE[0] + 0.3)*(1 - prog(t, S("r06") + 0.8, S("r06") + 1.3));
  if (roA > 0){ const k = E(prog(t, T_ROUTE[0] + 0.25, T_ROUTE[1])), pts = dense(ROUTE, 12).filter((_, i, a) => i/(a.length - 1) <= k + 1e-9);
    pts.push(routeAt(k)); const e = lineLL(pts, 1, roA, "#fff", 7, [18, 14]);
    if (e){ pulse(e[0], e[1], t, roA, Y1, 70); pin(e[0], e[1], roA, Y1, 15); } }
  // ---- Noël 1859 : les 24 lapins arrivent
  const n24 = prog(t, POPS24[0] - 0.1, POPS24[0])*(1 - prog(t, S("r07") + 0.2, S("r07") + 0.5));
  if (n24 > 0) NEAR.forEach((p, i) => { const [x, y] = P(...p), a = EB(prog(t, POPS24[i], POPS24[i] + 0.25))*n24; pin(x, y, a, `rgb(${INV})`, 12); });
  // ---- invasion (aplat + points)
  drawFront(t);
  if (t > S("r07")) drawDots(t);
  // ---- clôtures
  const fA = prog(t, S("r12"), S("r12") + 0.3)*(1 - prog(t, S("r14") - 0.2, S("r14") + 0.4));
  if (fA > 0){ const seg = [[THUDS[0] - 0.1, THUDS[6] + 0.1], [THUDS[7] - 0.1, THUDS[10] + 0.1], [THUDS[11] - 0.1, THUDS[13] + 0.1]];
